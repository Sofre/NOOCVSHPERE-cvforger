
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: nosphere-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: nosphere
      POSTGRES_USER: nosphere_user
      POSTGRES_PASSWORD: change_this_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
